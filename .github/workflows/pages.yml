name: Deploy handbook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - llm-tech-stack-handbook.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare the handbook site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s llm-tech-stack-handbook.html
          cmp index.html llm-tech-stack-handbook.html
          mkdir _site
          cp index.html llm-tech-stack-handbook.html _site/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
